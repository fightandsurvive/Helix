repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ['--maxkb=10240']
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.3
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        files: ^(engine|training|ingest|config|common|tests)/
      - id: ruff-format
        files: ^(engine|training|ingest|config|common|tests)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^engine/
        additional_dependencies: [types-requests, pydantic>=2]
        args: [--ignore-missing-imports]

  # ── Rust: only runs if cargo is on PATH AND src-tauri exists ─────
  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt (if cargo available)
        entry: pwsh -NoProfile -Command "if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) { Write-Host 'cargo not on PATH, skipping'; exit 0 }; cd app/src-tauri; cargo fmt -- --check; exit $LASTEXITCODE"
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy (if cargo available)
        entry: pwsh -NoProfile -Command "if (-not (Get-Command cargo -ErrorAction SilentlyContinue)) { Write-Host 'cargo not on PATH, skipping'; exit 0 }; cd app/src-tauri; cargo clippy -- -D warnings; exit $LASTEXITCODE"
        language: system
        files: \.rs$
        pass_filenames: false

      - id: tsc
        name: tsc typecheck (if node_modules exists)
        entry: pwsh -NoProfile -Command "if (-not (Test-Path app/node_modules/typescript)) { Write-Host 'app/node_modules not installed, skipping (run: cd app; npm install)'; exit 0 }; cd app; npx tsc --noEmit; exit $LASTEXITCODE"
        language: system
        files: \.(ts|tsx)$
        pass_filenames: false

  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--strict]
