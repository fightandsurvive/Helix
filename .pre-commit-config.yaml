# Pre-commit config — Windows-native, no external tool dependencies at
# hook-install time. Tools that require extra setup (cargo, tsc) run only
# if present, otherwise the hook silently passes. This keeps commits
# fast and unblocked on fresh clones.

repos:
  # ── Universal hygiene ─────────────────────────────────────────────
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: ["--maxkb=10240"]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: mixed-line-ending
        args: ["--fix=lf"]

  # ── Python: ruff (lint + format) ──────────────────────────────────
  # pre-commit installs ruff v0.7.3 in an isolated environment.
  # No need for ruff on your system PATH.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.3
    hooks:
      - id: ruff
        args: [--fix]
        files: ^(engine|training|ingest|config|common|analytics|tests)/
      - id: ruff-format
        files: ^(engine|training|ingest|config|common|analytics|tests)/

  # ── Python: mypy (relaxed) ────────────────────────────────────────
  # Only checks engine/ — the most type-critical package. Relaxed flags
  # because torch, chess, and psycopg stubs are inconsistent.
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        files: ^engine/
        additional_dependencies: [types-requests, pydantic>=2]
        args:
          - --ignore-missing-imports
          - --no-strict-optional
          - --check-untyped-defs
